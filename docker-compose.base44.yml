services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_APP_NAME=Zomi Dataset Studio
    restart: unless-stopped
