services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787"
      PRIVATE_DATA_DIR: /data
    volumes:
      - private_imports:/data
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 1g
volumes:
  private_imports:
