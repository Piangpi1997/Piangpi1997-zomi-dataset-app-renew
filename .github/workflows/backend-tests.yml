name: Backend API Tests
on:
  push:
    branches: [feature/private-import-backend, feature/secure-import-hardening, feature/backend-deploy-readiness, feature/backend-release-gates]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: backend
        run: npm install --no-audit --no-fund
      - working-directory: backend
        run: npm test
