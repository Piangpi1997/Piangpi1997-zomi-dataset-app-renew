name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/pwa-android-ai-review, feature/multimodal-import-api]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.ZOMI_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - name: Require HTTPS production API
        run: |
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo 'Set repository variable ZOMI_API_BASE_URL to a trusted HTTPS backend URL' >&2; exit 1;; esac
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zomi-dataset-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
