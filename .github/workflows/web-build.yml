name: Web PWA Build
on:
  push:
    branches: [main, feature/pwa-android-ai-review, feature/free-static-preview]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zomi-studio-web
          path: dist/
